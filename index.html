<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Character Network Map</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vis-Network CDN -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased h-screen overflow-hidden">

  <!-- Main Container -->
  <div class="flex h-full w-full">

    <!-- CANVAS VIEW (Left ~70%) -->
    <div class="relative flex-1 h-full bg-slate-50 border-r border-slate-200">
      
      <!-- Top Canvas Header Bar -->
      <div class="absolute top-4 left-4 z-10 flex items-center gap-4 bg-white/90 backdrop-blur-md px-4 py-2.5 rounded-xl shadow-sm border border-slate-200/80">
        <div class="text-sm font-semibold text-slate-700">
          <span id="stat-characters">0</span> characters, <span id="stat-relationships">0</span> relationships
        </div>
        <button id="btn-clear-selection" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg border border-slate-300 font-medium transition-colors hidden">
          Clear selection
        </button>
      </div>

      <!-- Top Right Control Panel -->
      <div class="absolute top-4 right-4 z-10 flex flex-col gap-1.5 bg-white/90 backdrop-blur-md p-1.5 rounded-xl shadow-sm border border-slate-200/80">
        <button id="btn-zoom-in" title="Zoom In" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors">
          <i data-lucide="zoom-in" class="w-5 h-5"></i>
        </button>
        <button id="btn-zoom-out" title="Zoom Out" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors">
          <i data-lucide="zoom-out" class="w-5 h-5"></i>
        </button>
        <button id="btn-reset-view" title="Reset View" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors border-t border-slate-100">
          <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Vis-Network Interactive Canvas Container -->
      <div id="character-network" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

      <!-- Bottom Left Floating Relationship Legend -->
      <div class="absolute bottom-4 left-4 z-10 bg-white/95 backdrop-blur-md p-4 rounded-xl shadow-md border border-slate-200/80 w-60">
        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5">Relationship Types</h4>
        <div id="legend-list" class="space-y-2 text-xs font-medium text-slate-600">
          <!-- Dynamic Legend Items Populated by JS -->
        </div>
      </div>

      <!-- Bottom Right Data Backup Tools -->
      <div class="absolute bottom-4 right-4 z-10 flex items-center gap-2 bg-white/90 backdrop-blur-md p-2 rounded-xl shadow-sm border border-slate-200/80">
        <button id="btn-export-json" class="flex items-center gap-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg border border-slate-200 transition-colors">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> Export JSON
        </button>
        <label class="flex items-center gap-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-1.5 rounded-lg border border-slate-200 cursor-pointer transition-colors">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import JSON
          <input type="file" id="input-import-json" accept=".json" class="hidden">
        </label>
      </div>
    </div>

    <!-- SIDEBAR INSPECTOR & EDITOR (Right ~30%) -->
    <div class="w-[420px] h-full bg-white flex flex-col border-l border-slate-200 shadow-lg z-20">
      
      <!-- Upper Section: Character Inspector -->
      <div class="p-6 border-b border-slate-200 overflow-y-auto max-h-[50%] bg-slate-50/50">
        <div id="inspector-empty-state" class="py-12 text-center text-slate-400">
          <i data-lucide="user-search" class="w-12 h-12 mx-auto mb-3 stroke-1 text-slate-300"></i>
          <p class="text-sm font-medium">Select a character from the map to view details.</p>
        </div>

        <div id="inspector-content" class="hidden space-y-4">
          <!-- Header info -->
          <div class="flex items-start gap-4">
            <img id="inspector-avatar" src="" alt="Avatar" class="w-16 h-16 rounded-full object-cover border-2 border-indigo-500 shadow-sm bg-slate-200">
            <div>
              <h2 id="inspector-name" class="text-xl font-bold text-slate-800 leading-tight"></h2>
              <span id="inspector-archetype" class="inline-block mt-1 px-2.5 py-0.5 text-xs font-semibold rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100"></span>
            </div>
          </div>

          <!-- Description / Bio -->
          <div>
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Character Overview</h4>
            <p id="inspector-description" class="text-sm text-slate-600 leading-relaxed bg-white p-3 rounded-lg border border-slate-200 shadow-2xs"></p>
          </div>

          <!-- Relationships Breakdown -->
          <div>
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Connected Relationships</h4>
            <div id="inspector-relationships-list" class="space-y-2">
              <!-- Dynamically populated links -->
            </div>
          </div>
        </div>
      </div>

      <!-- Lower Section: Form Drawer (Add / Edit Controls strictly placed below) -->
      <div class="flex-1 p-6 overflow-y-auto bg-white space-y-6">
        
        <!-- Form Header Toggle -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <h3 id="form-title" class="text-base font-bold text-slate-800">Add New Character</h3>
          <button id="btn-mode-toggle" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold underline">
            Reset to New Form
          </button>
        </div>

        <!-- Character Details Form -->
        <form id="form-character" class="space-y-3">
          <input type="hidden" id="edit-character-id">
          
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Character Name</label>
            <input type="text" id="input-char-name" required placeholder="e.g., Jean Valjean" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Archetype / Role Tag</label>
              <input type="text" id="input-char-role" placeholder="e.g., Protagonist" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Avatar Image URL</label>
              <input type="url" id="input-char-avatar" placeholder="https://..." class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Overview / Bio Notes</label>
            <textarea id="input-char-bio" rows="3" placeholder="Enter notes or character background..." class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 resize-none"></textarea>
          </div>

          <div class="flex gap-2 pt-1">
            <button type="submit" id="btn-save-character" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2 rounded-lg transition-colors shadow-xs">
              Save Character
            </button>
            <button type="button" id="btn-delete-character" class="hidden bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-medium text-sm px-3 py-2 rounded-lg transition-colors">
              Delete
            </button>
          </div>
        </form>

        <hr class="border-slate-100">

        <!-- Relationship Link Form -->
        <div class="space-y-3">
          <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Manage Relationship Link</h4>
          <form id="form-relationship" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Target Connected Character</label>
              <select id="select-target-character" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg bg-white focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                <option value="">-- Select Target --</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Relationship Type</label>
                <select id="select-rel-type" required class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg bg-white focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                  <option value="Ally/Friend">Ally/Friend</option>
                  <option value="Authority/Power">Authority/Power</option>
                  <option value="Family">Family</option>
                  <option value="Rival/Enemy">Rival/Enemy</option>
                  <option value="Romantic">Romantic</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Custom Label (Optional)</label>
                <input type="text" id="input-rel-label" placeholder="e.g., Foster Father" class="w-full text-sm px-3 py-2 border border-slate-200 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
              </div>
            </div>

            <button type="submit" id="btn-save-relationship" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium text-sm py-2 rounded-lg transition-colors shadow-xs">
              Link Relationships
            </button>
          </form>
        </div>

      </div>
    </div>

  </div>

  <!-- Load Main Logic -->
  <script src="app.js"></script>
</body>
</html>
