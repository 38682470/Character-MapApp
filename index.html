<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Import Example</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      padding: 2rem; 
    }
    dialog { 
      border: 1px solid #ccc; 
      border-radius: 8px; 
      padding: 1.5rem; 
      max-width: 480px; 
      width: 100%; 
    }
    dialog::backdrop { 
      background: rgba(0, 0, 0, 0.5); 
    }
    .form-group { 
      margin-bottom: 1rem; 
    }
    textarea { 
      width: 100%; 
      box-sizing: border-box; 
      font-family: monospace; 
    }
    menu { 
      display: flex; 
      justify-content: flex-end; 
      gap: 0.5rem; 
      padding: 0; 
      margin-top: 1rem; 
    }
  </style>
</head>
<body>

  <!-- Open Modal Button -->
  <button id="btn-open-import-modal">Import JSON</button>

  <!-- Modal Dialog -->
  <dialog id="import-modal">
    <form id="json-import-form" method="dialog">
      <h2>Import JSON Data</h2>
      
      <!-- Option A: File Upload -->
      <div class="form-group">
        <label for="json-file-input">Select JSON File:</label><br><br>
        <input type="file" id="json-file-input" accept=".json,application/json">
      </div>

      <p style="text-align: center; font-weight: bold;">- OR -</p>

      <!-- Option B: Text Paste -->
      <div class="form-group">
        <label for="json-text-input">Paste Raw JSON:</label><br><br>
        <textarea id="json-text-input" rows="8" placeholder='{"key": "value"}'></textarea>
      </div>

      <!-- Error Notice -->
      <p id="import-error" style="color: #d9534f; display: none; margin: 0.5rem 0;"></p>

      <!-- Buttons -->
      <menu>
        <button type="button" id="btn-close-modal">Cancel</button>
        <button type="submit" id="btn-submit-import">Import</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
