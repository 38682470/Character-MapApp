<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Network Map</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vis-Network CDN -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">

    <!-- Top Navigation / Controls Bar -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
            <i data-lucide="share-2" class="w-6 h-6 text-indigo-400"></i>
            <h1 class="text-xl font-bold tracking-wide">Character Network Map</h1>
        </div>

        <div class="flex items-center gap-4 flex-wrap">
            <!-- Multi-Map Selector -->
            <div class="flex items-center gap-2">
                <label for="map-select" class="text-sm font-medium text-gray-300">Map:</label>
                <select id="map-select" class="bg-gray-700 text-white text-sm rounded-lg border border-gray-600 px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="default">Default Network</option>
                </select>
                <button id="add-map-btn" title="Add New Map" class="p-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-white transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Physics / Node Spacing Slider -->
            <div class="flex items-center gap-2 bg-gray-700/50 px-3 py-1.5 rounded-lg border border-gray-600">
                <i data-lucide="sliders" class="w-4 h-4 text-gray-400"></i>
                <label for="node-spacing-slider" class="text-xs font-medium text-gray-300">Spacing:</label>
                <input type="range" id="node-spacing-slider" min="50" max="400" value="150" class="w-24 accent-indigo-500 cursor-pointer">
            </div>

            <!-- Import / Export Actions -->
            <div class="flex items-center gap-2">
                <button id="open-import-modal-btn" class="flex items-center gap-1.5 bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    <i data-lucide="upload" class="w-4 h-4 text-indigo-400"></i>
                    Import JSON
                </button>
                <button id="export-json-btn" class="flex items-center gap-1.5 bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                    <i data-lucide="download" class="w-4 h-4 text-green-400"></i>
                    Export JSON
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 relative overflow-hidden flex">
        <!-- Vis-Network Graph Container -->
        <div id="network-container" class="w-full h-full min-h-[calc(100vh-80px)] bg-gray-950"></div>
    </main>

    <!-- In-App JSON Import Modal -->
    <div id="import-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl w-full max-w-lg p-6 relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold flex items-center gap-2">
                    <i data-lucide="file-json" class="w-5 h-5 text-indigo-400"></i>
                    Import Map Data
                </h3>
                <button id="close-import-modal-btn" class="text-gray-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <p class="text-xs text-gray-400 mb-3">Paste your JSON data below or drop a valid JSON file to import.</p>
            
            <!-- Drag and Drop Zone / Textarea -->
            <div id="drop-zone" class="border-2 border-dashed border-gray-600 rounded-lg p-4 bg-gray-900/50 mb-4 transition text-center">
                <textarea id="json-input" rows="6" class="w-full bg-transparent text-xs text-gray-200 focus:outline-none resize-none font-mono" placeholder='{"nodes": [...], "edges": [...]}'></textarea>
            </div>

            <div class="flex justify-end gap-3">
                <button id="cancel-import-btn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-sm font-medium rounded-lg transition">Cancel</button>
                <button id="confirm-import-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-sm font-medium rounded-lg transition">Import Data</button>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
    <script>
        // Initialize Lucide Icons
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
