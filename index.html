<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Network Map</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vis Network CDN -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        #network-container {
            height: 650px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <i data-lucide="share-2" class="w-6 h-6 text-indigo-400"></i>
            <h1 class="text-xl font-bold tracking-wide">Character Network Map</h1>
        </div>

        <div class="flex items-center space-x-6 text-sm">
            <div class="flex items-center space-x-2">
                <span class="text-gray-400">Map:</span>
                <select id="map-select" class="bg-gray-700 border border-gray-600 rounded px-3 py-1.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="default">Default Network</option>
                </select>
                <button id="add-map-btn" class="bg-indigo-600 hover:bg-indigo-500 px-2.5 py-1.5 rounded text-white font-bold">+</button>
            </div>

            <div class="flex items-center space-x-2">
                <span class="text-gray-400">Spacing:</span>
                <input id="node-spacing-slider" type="range" min="50" max="300" value="150" class="cursor-pointer accent-indigo-500">
            </div>

            <div class="flex items-center space-x-3">
                <button id="open-import-modal-btn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded border border-gray-600 flex items-center space-x-1">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <span>Import JSON</span>
                </button>
                <button id="export-json-btn" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded border border-gray-600 flex items-center space-x-1">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>Export JSON</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Canvas Area -->
    <main class="flex-1 p-6 flex flex-col">
        <div id="network-container" class="bg-gray-950 border border-gray-800 rounded-xl shadow-2xl relative overflow-hidden"></div>
    </main>

    <!-- Import Modal -->
    <div id="import-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-800 border border-gray-700 rounded-xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                <h3 class="text-lg font-bold">Import Character Data</h3>
                <button id="close-import-modal-btn" class="text-gray-400 hover:text-white">&times;</button>
            </div>
            
            <div id="drop-zone" class="border-2 border-dashed border-gray-600 rounded-lg p-6 text-center text-gray-400 hover:border-indigo-500 cursor-pointer">
                Drag & Drop JSON file here or paste data below
            </div>

            <textarea id="json-input" rows="5" class="w-full bg-gray-900 border border-gray-700 rounded p-3 text-sm font-mono text-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder='{"nodes": [...], "edges": [...]}'></textarea>

            <div class="flex justify-end space-x-3 pt-2">
                <button id="cancel-import-btn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm">Cancel</button>
                <button id="confirm-import-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-sm font-semibold">Load Network</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Render Lucide Icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            const container = document.getElementById('network-container');
            const mapSelect = document.getElementById('map-select');
            const addMapBtn = document.getElementById('add-map-btn');
            const spacingSlider = document.getElementById('node-spacing-slider');
            const openImportBtn = document.getElementById('open-import-modal-btn');
            const exportBtn = document.getElementById('export-json-btn');
            
            const importModal = document.getElementById('import-modal');
            const closeImportBtn = document.getElementById('close-import-modal-btn');
            const cancelImportBtn = document.getElementById('cancel-import-btn');
            const confirmImportBtn = document.getElementById('confirm-import-btn');
            const jsonInput = document.getElementById('json-input');

            // Default Data Setup
            const nodes = new vis.DataSet([
                { id: 1, label: 'Protagonist', shape: 'ellipse', color: '#6366f1', font: { color: '#ffffff' } },
                { id: 2, label: 'Mentor', shape: 'ellipse', color: '#10b981', font: { color: '#ffffff' } },
                { id: 3, label: 'Antagonist', shape: 'ellipse', color: '#ef4444', font: { color: '#ffffff' } }
            ]);

            const edges = new vis.DataSet([
                { from: 1, to: 2, label: 'Guided by', color: { color: '#94a3b8' } },
                { from: 1, to: 3, label: 'Opposes', color: { color: '#f87171' } }
            ]);

            const options = {
                nodes: { borderWidth: 2, shadow: true },
                edges: { width: 2, shadow: true, smooth: { type: 'continuous' } },
                physics: {
                    solver: 'forceAtlas2Based',
                    forceAtlas2Based: { gravitationalConstant: -50, centralGravity: 0.01, springLength: 150, springConstant: 0.08 }
                },
                interaction: { hover: true, navigationButtons: true, keyboard: true }
            };

            // Initialize Vis Network
            let network = null;
            if (container && typeof vis !== 'undefined') {
                network = new vis.Network(container, { nodes, edges }, options);
            }

            // Controls
            if (spacingSlider && network) {
                spacingSlider.addEventListener('input', (e) => {
                    network.setOptions({ physics: { forceAtlas2Based: { springLength: parseInt(e.target.value, 10) } } });
                });
            }

            const showModal = () => importModal.classList.remove('hidden'), importModal.classList.add('flex');
            const hideModal = () => importModal.classList.add('hidden'), importModal.classList.remove('flex');

            if (openImportBtn) openImportBtn.addEventListener('click', showModal);
            if (closeImportBtn) closeImportBtn.addEventListener('click', hideModal);
            if (cancelImportBtn) cancelImportBtn.addEventListener('click', hideModal);

            if (exportBtn) {
                exportBtn.addEventListener('click', () => {
                    const exportData = { nodes: nodes.get(), edges: edges.get() };
                    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'character-network.json';
                    a.click();
                });
            }

            if (confirmImportBtn) {
                confirmImportBtn.addEventListener('click', () => {
                    const rawVal = jsonInput ? jsonInput.value.trim() : '';
                    if (!rawVal) return;
                    try {
                        const parsed = JSON.parse(rawVal);
                        if (parsed.nodes && parsed.edges) {
                            nodes.clear();
                            edges.clear();
                            nodes.add(parsed.nodes);
                            edges.add(parsed.edges);
                            hideModal();
                            jsonInput.value = '';
                        }
                    } catch (err) {
                        alert('Invalid JSON: ' + err.message);
                    }
                });
            }

            if (addMapBtn && mapSelect) {
                addMapBtn.addEventListener('click', () => {
                    const name = prompt('Enter map name:');
                    if (name) {
                        const opt = document.createElement('option');
                        opt.value = name.toLowerCase().replace(/\s+/g, '-');
                        opt.textContent = name;
                        mapSelect.appendChild(opt);
                        mapSelect.value = opt.value;
                    }
                });
            }
        });
    </script>
</body>
</html>
